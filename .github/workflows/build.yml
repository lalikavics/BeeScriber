name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $dir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$dir\ISCC.exe")) { choco install innosetup -y --no-progress }
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: BeeScriber-setup
          path: build/*.exe
          if-no-files-found: error

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?\r?\n(.*?)(?=^## |\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $body + "`n`n**Install:** download ``BeeScriber-$v-setup.exe`` below and run it. Windows 10 / 11, 64-bit. Python is not needed." |
            Out-File build/notes.md -Encoding utf8

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.exe
          body_path: build/notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}

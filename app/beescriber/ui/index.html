<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeeScriber</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.png">
</head>
<body>
<header id="titlebar">
  <div class="hbox brandbox">
    <img src="logo.png" alt="">
    <div class="bt">
      <div class="bn"><span id="appName">BeeScriber</span><span class="vpill" id="ver"></span></div>
      <div class="bs" data-t="brandSub"></div>
      <div class="bc"><span data-t="byline"></span> <span id="author"></span></div>
    </div>
  </div>
  <div class="hbox statbox" id="statbox">
    <div class="meters" id="meters">
      <div class="meter" id="mGpu" hidden><span class="ml">GPU</span><i><b></b></i><span class="mv"></span></div>
      <div class="meter" id="mVram" hidden><span class="ml">VRAM</span><i><b></b></i><span class="mv"></span></div>
      <div class="meter" id="mCpu" hidden><span class="ml">CPU</span><i><b></b></i><span class="mv"></span></div>
    </div>
  </div>
  <span class="grow"></span>
  <div class="hbox ctlbox">
    <div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="hu">HU</button></div>
    <button class="btn sm" id="aboutBtn" type="button" data-t="about"></button>
    <button class="btn stop" id="pauseBtn" type="button" disabled data-t="pause"></button>
    <button class="btn go" id="goBtn" type="button"></button>
  </div>
  <div class="corner">
    <div class="winbtns" id="winbtns" hidden>
      <button type="button" id="wMin" data-tt="wMin"><svg viewBox="0 0 10 10"><path d="M1 5.5h8"/></svg></button>
      <button type="button" id="wMax" data-tt="wMax"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button>
      <button type="button" id="wClose" class="x" data-tt="wClose"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
    </div>
    <a href="#" class="coffee" id="coffee"><svg viewBox="0 0 16 16"><path d="M2.5 6h8.5v3.5a3.5 3.5 0 0 1-3.5 3.5h-1.5A3.5 3.5 0 0 1 2.5 9.5z"/><path d="M11 7h1.2a1.6 1.6 0 0 1 0 3.2H10.6"/><path d="M5 2.2c-.5.6.5 1.2 0 1.8M7.6 2.2c-.5.6.5 1.2 0 1.8"/></svg><span data-t="coffee"></span></a>
  </div>
</header>
<main>
  <section class="col" id="colL">
    <div class="note warn" id="toolsNote" hidden><div id="toolsText"></div><div class="row" style="margin-top:8px"><button class="btn sm pri" id="toolsGet" type="button" data-t="toolsGet"></button><span class="hint" id="toolsProg"></span></div></div>

    <details class="card" open>
      <summary><span class="n">1</span><span data-t="c1"></span></summary>
      <div class="cbody">
        <textarea id="src" spellcheck="false" data-tp="srcPh"></textarea>
        <div class="row">
          <button class="btn pri" id="loadBtn" type="button" data-t="load"></button>
          <button class="btn" id="filesBtn" type="button" data-t="addFiles"></button>
        </div>
        <div class="hint" data-t="fmtList"></div>
        <div class="f inline"><div class="hint" data-t="clipWatch"></div><label class="sw"><input type="checkbox" id="clipSw"><span></span></label></div>
      </div>
    </details>

    <details class="card" open>
      <summary><span class="n">2</span><span data-t="c2"></span></summary>
      <div class="cbody">
        <div class="f"><span class="lab" data-t="folder"></span>
          <div class="row nw"><div class="path grow" id="outDir"></div>
            <button class="btn xs" id="outPick" type="button" data-t="browse"></button><button class="btn xs" id="outOpen" type="button" data-t="open"></button></div>
        </div>
        <div class="f"><span class="lab" data-t="formats"></span><div class="chips" id="fmtChips"></div></div>
        <div class="f"><span class="lab" data-t="txtLayout"></span>
          <select id="txtMode"><option value="paragraphs" data-t="lay_paragraphs"></option><option value="sentences" data-t="lay_sentences"></option><option value="plain" data-t="lay_plain"></option></select>
        </div>
        <div class="f inline"><div data-t="header"></div><label class="sw"><input type="checkbox" id="hdrSw"><span></span></label></div>
        <div class="f inline"><div data-t="timestamps"></div><label class="sw"><input type="checkbox" id="tsSw"><span></span></label></div>
      </div>
    </details>

    <details class="card" id="setCard">
      <summary><span class="n">3</span><span data-t="c3"></span></summary>
      <div class="cbody">
        <div class="f"><span class="lab" data-t="model"></span><select id="model"></select></div>
        <div class="f"><span class="lab" data-t="language"></span><select id="language"></select></div>
        <div class="f"><span class="lab" data-t="gpuLimit"></span>
          <select id="gpuLimit"><option value="100">100%</option><option value="90">90%</option><option value="75">75%</option><option value="50">50%</option></select>
          <div class="hint" data-t="gpuHint"></div></div>
        <div class="f inline"><div><div data-t="diarize"></div><div class="hint" data-t="diarizeHint"></div></div><label class="sw"><input type="checkbox" id="diarSw"><span></span></label></div>
        <div class="row nw" id="spkF"><span class="lab" data-t="speakers"></span>
          <select id="spkN" style="width:auto"><option value="0" data-t="spkAuto"></option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
          <span class="grow"></span><button class="btn xs" id="diarSetup" type="button" data-t="dSetupBtn"></button></div>
        <details class="mini"><summary data-t="advanced"></summary><div>
          <div class="f"><span class="lab" data-t="device"></span>
            <select id="device"><option value="auto" data-t="dev_auto"></option><option value="cuda" data-t="dev_cuda"></option><option value="cpu" data-t="dev_cpu"></option></select></div>
          <div class="f inline"><div><div data-t="guard"></div><div class="hint" data-t="guardHint"></div></div><label class="sw"><input type="checkbox" id="guardSw"><span></span></label></div>
          <div class="f inline"><div data-t="plSub"></div><label class="sw"><input type="checkbox" id="plSw"><span></span></label></div>
          <div class="f"><span class="lab" data-t="nameTpl"></span><input type="text" id="nameTpl" spellcheck="false"></div>
          <div class="f"><span class="lab" data-t="plNameTpl"></span><input type="text" id="plNameTpl" spellcheck="false"><div class="hint" data-t="nameHint"></div></div>
          <div class="f"><span class="lab" data-t="customModel"></span><input type="text" id="customModel" spellcheck="false" placeholder="C:\models\my-whisper-ct2"></div>
          <div class="f"><span class="lab" data-t="cookies"></span>
            <select id="ckMode"><option value="none" data-t="ck_none"></option><option value="browser" data-t="ck_browser"></option><option value="file" data-t="ck_file"></option></select>
            <select id="ckBrowser"><option>firefox</option><option>chrome</option><option>edge</option><option>brave</option><option>opera</option><option>vivaldi</option></select>
            <div class="row nw" id="ckFileF"><div class="path grow" id="ckFile">–</div><button class="btn xs" id="ckPick" type="button" data-t="browse"></button></div>
            <div class="hint" data-t="cookiesHint"></div></div>
          <div class="f"><span class="lab" data-t="tools"></span><div class="hint" id="toolVers">…</div>
            <div class="row"><button class="btn sm" id="updBtn" type="button" data-t="updYt"></button></div></div>
        </div></details>
      </div>
    </details>
  </section>

  <section id="colC">
    <div class="tabs">
      <button class="tab act" data-tab="list" type="button"><span data-t="tabList"></span><span class="cnt" id="cntList">0</span></button>
      <button class="tab" data-tab="preview" type="button"><span data-t="tabPreview"></span></button>
      <button class="tab" data-tab="history" type="button"><span data-t="tabHistory"></span><span class="cnt" id="cntHist">0</span></button>
    </div>

    <div class="view" id="v-list">
      <div class="bar2" id="listBar" hidden>
        <input type="search" id="flt" data-tp="filter" style="max-width:260px">
        <button class="btn sm" id="selAll" type="button" data-t="all"></button>
        <button class="btn sm" id="selNone" type="button" data-t="none"></button>
        <button class="btn sm" id="selNew" type="button" data-t="notDone"></button>
        <span class="grow"></span>
        <button class="btn sm ghost" id="clearList" type="button" data-t="clearList"></button>
      </div>
      <div class="scroll" id="listBox"></div>
      <div class="foot" id="listFoot" hidden>
        <span class="muted" id="selInfo"></span><span class="grow"></span>
        <button class="btn" id="addQ" type="button" data-t="addQueue"></button>
        <button class="btn go" id="addGo" type="button" data-t="addStart" style="padding:8px 18px;font-size:14px"></button>
      </div>
    </div>

    <div class="view" id="v-preview" hidden>
      <div id="pvHead">
        <div class="row nw"><div id="pvTitle" class="grow">–</div>
          <label class="row nw hint" style="gap:6px;cursor:pointer"><input type="checkbox" id="pvFollow" checked><span data-t="autoscroll"></span></label>
          <button class="btn sm" id="pvCopy" type="button" data-t="copy"></button></div>
        <div class="pbar big"><i id="pvBar"></i></div>
        <div id="pvMeta"></div>
      </div>
      <div id="pvText"></div>
    </div>

    <div class="view" id="v-history" hidden>
      <div class="bar2">
        <input type="search" id="hFlt" data-tp="filter" style="max-width:260px">
        <span class="grow"></span>
        <button class="btn sm stop" id="hDelSel" type="button" data-t="hDel" disabled></button>
        <button class="btn sm stop" id="hDelAll" type="button" data-t="hDelAll"></button>
      </div>
      <div class="scroll" id="histBox"></div>
    </div>
  </section>

  <section class="col" id="colR">
    <div class="qhead">
      <h2><span data-t="queue"></span><span class="cnt muted" id="qCount"></span><span class="grow"></span>
        <button class="ib" id="retryAll" type="button" data-tt="retryAll">↻</button>
        <button class="ib x" id="clearQ" type="button" data-tt="clearQueue">✕</button></h2>
      <div class="pbar"><i id="qBar"></i></div>
      <div class="hint" id="qInfo"></div>
      <div class="state" id="state" hidden></div>
      <div class="note" id="qUnfinished" hidden></div>
      <div class="f inline"><div class="hint" data-t="pauseAfter"></div><label class="sw"><input type="checkbox" id="pauseAfterSw"><span></span></label></div>
    </div>
    <div class="qlist" id="qList"></div>
    <div class="empty" id="qEmpty" data-t="qEmpty"></div>
  </section>
</main>
<div id="bottombar"></div>
<div class="edge" data-e="t"></div><div class="edge" data-e="b"></div><div class="edge" data-e="l"></div><div class="edge" data-e="r"></div>
<div class="edge" data-e="tl"></div><div class="edge" data-e="tr"></div><div class="edge" data-e="bl"></div><div class="edge" data-e="br"></div>
<div id="ctx" hidden><button type="button" data-a="cut" data-t="cut"></button><button type="button" data-a="copy" data-t="copyC"></button><button type="button" data-a="paste" data-t="paste"></button><hr><button type="button" data-a="all" data-t="selectAll"></button></div>
<div id="modal"><div class="box"><div class="mh"><span id="modalTitle"></span><span style="flex:1"></span><a class="cof" id="cofBtn" href="#">☕ Buy me a coffee<span class="more"><span class="in">…or a pizza <svg class="mk" viewBox="5 7 54 55" aria-hidden="true"><path d="M44 52c6 2 12-1 13-7" fill="none" stroke="#4a2a12" stroke-width="3" stroke-linecap="round"/><ellipse cx="32" cy="48" rx="13" ry="11" fill="#5a3518"/><ellipse cx="32" cy="50" rx="8" ry="7" fill="#e0ad7e"/><circle cx="13" cy="25" r="7" fill="#5a3518"/><circle cx="13" cy="25" r="4" fill="#e0ad7e"/><circle cx="51" cy="25" r="7" fill="#5a3518"/><circle cx="51" cy="25" r="4" fill="#e0ad7e"/><circle cx="32" cy="25" r="17" fill="#5a3518"/><path d="M20 26c0-6 5-9 8-7 2 1 6 1 8 0 3-2 8 1 8 7 0 8-5 12-12 12s-12-4-12-12z" fill="#e0ad7e"/><ellipse cx="22" cy="31" rx="2.4" ry="1.5" fill="#f29a8a" opacity=".8"/><ellipse cx="42" cy="31" rx="2.4" ry="1.5" fill="#f29a8a" opacity=".8"/><circle cx="26.3" cy="24" r="3.5" fill="#1a1305"/><circle cx="37.7" cy="24" r="3.5" fill="#1a1305"/><circle cx="27.5" cy="22.7" r="1.3" fill="#fff"/><circle cx="38.9" cy="22.7" r="1.3" fill="#fff"/><ellipse cx="32" cy="33.2" rx="3.6" ry="3" fill="#5a1d14"/><path d="M41.8 60.4L57.8 48.4 56 46 40 58z" fill="#c9852f" stroke="#8a5418" stroke-width=".8" stroke-linejoin="round"/><path d="M31.5 32.5L56 46 40 58z" fill="#f6c453" stroke="#b8741f" stroke-width="1" stroke-linejoin="round"/><circle cx="41" cy="45" r="2.5" fill="#d9442f"/><circle cx="47.5" cy="49" r="2.2" fill="#d9442f"/><circle cx="42.5" cy="52.5" r="2" fill="#d9442f"/><circle cx="46" cy="44.5" r="1.1" fill="#3f7d2c"/><circle cx="38" cy="40.5" r="1" fill="#3f7d2c"/><path d="M46.5 56.2q.6 3.4 1.9 3.6 1.1-.2.8-3.4z" fill="#ffd36b"/><path d="M28.6 33.6q3.4 2.6 6.8 0" fill="none" stroke="#e0ad7e" stroke-width="1.6" stroke-linecap="round"/><circle cx="42" cy="56.5" r="3.6" fill="#5a3518"/><circle cx="54.5" cy="47.2" r="3.6" fill="#5a3518"/></svg></span></span></a><button class="btn sm" id="modalClose" type="button" data-t="close"></button></div><div class="mb" id="modalBody"></div><div class="mf" id="modalFoot" hidden></div></div></div>
<div id="dropOv" data-t="dropHint"></div>
<div id="toasts"></div>
<div id="boot">Loading…</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
